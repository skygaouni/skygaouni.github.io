<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡迎來到 skygaouni 的個人網站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .status {
            display: inline-block;
            padding: 6px 14px;
            background-color: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border-radius: 9999px;
            font-size: 0.85rem;
            margin-bottom: 28px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px;
            background-color: #334155;
            color: #f8fafc;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">🚀</div>
        <h1>skygaouni</h1>
        <p class="subtitle">網站架設中，敬請期待！</p>
        <span class="status">● GitHub Pages 上線運行中</span>

        <div class="links">
            <a href="https://github.com/skygaouni" class="btn" target="_blank">造訪 GitHub</a>
        </div>
    </div>

</body>
</html>
